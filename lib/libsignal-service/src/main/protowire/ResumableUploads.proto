syntax = "proto3";

option java_package = "org.signal.protos.resumableuploads";

message ResumableUpload {
  message Header {
    string key = 1;
    string value = 2;
  }

           bytes  secretKey = 1;
           bytes  iv        = 2;
           string cdnKey    = 3;
           uint32 cdnNumber = 4;
           string location  = 5;
           uint64 timeout   = 6;
  repeated Header headers   = 7;
  // Tellomi（tellomi/tellomi#1055 第三刀）：这次上传开始时的区（RegionProfile 契约第六节：在途的续传钉住开始时的区）。
  // 空 = 这一刀之前存下的，按 global。号码取大，免得和上游以后加的字段撞。
           string tellomiRegionId = 100;
}