name: Android CI

on:
  pull_request:
  push:
    branches:
    - 'main'
    - '8.**'

permissions:
  contents: read # to fetch code (actions/checkout)

jobs:
  build:

    runs-on: ubuntu-latest-8-cores

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # gh api repos/actions/checkout/commits/v6 --jq '.sha'
      with:
          submodules: true
          lfs: true

    - name: set up JDK 21
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
      # gh api repos/actions/setup-java/commits/v5 --jq '.sha'
      with:
        distribution: temurin
        java-version: 21

    - name: Validate Gradle Wrapper
      uses: gradle/actions/wrapper-validation@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      # gh api repos/gradle/actions/commits/v6 --jq '.sha'

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
      # gh api repos/gradle/actions/commits/v6 --jq '.sha'
      with:
        # Only 8.** branch builds write to the cache; everything else (PRs, etc.) reads only.
        cache-read-only: ${{ !startsWith(github.ref, 'refs/heads/8.') }}
        # Required to persist the Gradle configuration cache across runs.
        cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

    # Maven 源里没有 tellomi 的 libsignal：从公开 Release 下载，按 verification-metadata.xml 核对 sha256 后放进 mavenLocal。
    - name: Install tellomi libsignal from release
      run: |
        python3 - <<'PY'
        import hashlib, http.client, os, re, time, urllib.request
        import xml.etree.ElementTree as ET

        version = re.search(r'^libsignal-client\s*=\s*"([^"]+)"', open("gradle/libs.versions.toml", encoding="utf-8").read(), re.M).group(1)
        pins = {}
        for comp in ET.parse("gradle/verification-metadata.xml").getroot().findall(".//{*}component"):
            if comp.get("group") == "org.signal" and comp.get("version") == version and comp.get("name") in ("libsignal-android", "libsignal-client"):
                for art in comp.findall("{*}artifact"):
                    pins[(comp.get("name"), art.get("name"))] = art.find("{*}sha256").get("value")
        if len(pins) != 4:
            raise SystemExit(f"expected 4 pinned artifacts for {version}, found {len(pins)}")


        def fetch(url):
            for attempt in range(3):
                try:
                    return urllib.request.urlopen(url, timeout=300).read()
                except (OSError, http.client.HTTPException):
                    if attempt == 2:
                        raise
                    time.sleep(5)


        blobs = {}
        for (name, file), sha in sorted(pins.items()):
            data = fetch(f"https://github.com/tellomi/libsignal/releases/download/v{version}/{file}")
            if hashlib.sha256(data).hexdigest() != sha:
                raise SystemExit(f"sha256 mismatch, nothing written: {file}")
            blobs[(name, file)] = data
        for (name, file), data in blobs.items():
            target = os.path.expanduser(f"~/.m2/repository/org/signal/{name}/{version}")
            os.makedirs(target, exist_ok=True)
            with open(os.path.join(target, file), "wb") as f:
                f.write(data)
        print("installed:", ", ".join(file for _, file in blobs))
        PY

    # Pull requests run the fast custom linter (ciRemote); pushes to main / 8.x branches run the
    # full Android lint (qaRemote). Both include screenshot validation, which is deliberately kept
    # out of the local qa/ci tasks because screenshot rendering is host-OS dependent.
    - name: Build with Gradle
      env:
        SIGNAL_BUILD_CACHE_URL: ${{ secrets.SIGNAL_BUILD_CACHE_URL }}
        SIGNAL_BUILD_CACHE_USER: ${{ secrets.SIGNAL_BUILD_CACHE_USER }}
        SIGNAL_BUILD_CACHE_PASSWORD: ${{ secrets.SIGNAL_BUILD_CACHE_PASSWORD }}
        SIGNAL_BUILD_CACHE_PUSH: ${{ startsWith(github.ref, 'refs/heads/8.') }}
      run: ./gradlew ${{ github.event_name == 'pull_request' && 'ciRemote' || 'qaRemote' }}

    - name: Archive reports for failed build
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      # gh api repos/actions/upload-artifact/commits/v7 --jq '.sha'
      with:
        name: reports
        path: |
          **/build/reports
          **/build/test-results
        if-no-files-found: ignore
